upstream crypto_signal_api_upstream {
    server crypto-signal-api:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sasi.asia www.sasi.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sasi.asia www.sasi.asia;

    ssl_certificate /etc/letsencrypt/live/sasi.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sasi.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        auth_basic "Private Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://crypto_signal_api_upstream/dashboard/;
    }

    location /api/ {
        auth_basic "Private Dashboard API";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://crypto_signal_api_upstream/api/;
    }

    location /health {
        proxy_pass http://crypto_signal_api_upstream/health;
    }

    location = /home {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
