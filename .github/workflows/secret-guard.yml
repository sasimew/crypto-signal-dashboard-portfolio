name: Secret Guard

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block forbidden tracked paths
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.htpasswd|data/|export/|env/)' ; then
            echo "Forbidden tracked path detected."
            exit 1
          fi

      - name: Scan for likely secrets
        run: |
          set -euo pipefail
          if grep -RInE \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-api[0-9A-Za-z_-]+|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|xox[baprs]-[A-Za-z0-9-]+|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|TELEGRAM_TOKEN=[0-9]{6,}:[A-Za-z0-9_-]{20,}|TG_BOT_TOKEN=[0-9]{6,}:[A-Za-z0-9_-]{20,}|ANTHROPIC_API_KEY=sk-ant-api[0-9A-Za-z_-]+' \
            . \
            --exclude-dir=.git
          then
            echo "Likely secret detected."
            exit 1
          fi

      - name: Validate Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile api_server.py recheck.py
