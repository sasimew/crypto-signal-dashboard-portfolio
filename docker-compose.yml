# BUG FIX #6: cron ติดตั้งใน Dockerfile แล้ว ไม่ต้อง apt-get ใน CMD
# BUG FIX #7: ใช้ bind mount ./data แบบถูกต้อง ไม่ใช่ named volume


services:

  crypto-api:
    build: .
    container_name: crypto-signal-api
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /root/secrets/google-service-account.json:/app/google-service-account.json:ro
      - ./dashboard.html:/app/dashboard.html:ro
      - ./api_server.py:/app/api_server.py:ro
      - ./bot.py:/app/bot.py:ro
      - ./config.py:/app/config.py:ro
      - ./bot_set2.py:/app/bot_set2.py:ro
      - ./bot_set3.py:/app/bot_set3.py:ro
      - ./config_set2.py:/app/config_set2.py:ro
      - ./recheck.py:/app/recheck.py:ro
      - ./export_log.py:/app/export_log.py:ro
      - ./clean_signal_errors.py:/app/clean_signal_errors.py:ro
    environment:
      - DATA_DIR=/app/data
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-service-account.json
      - CRYPTO_BOT_MODULE=${CRYPTO_BOT_MODULE:-bot_set3}
      - CRYPTO_CONFIG_MODULE=${CRYPTO_CONFIG_MODULE:-config_set2}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  crypto-bot:
    build: .
    container_name: crypto-signal-bot
    restart: always
    volumes:
      - ./data:/app/data
      - ./bot.py:/app/bot.py:ro
      - ./config.py:/app/config.py:ro
      - ./bot_set2.py:/app/bot_set2.py:ro
      - ./bot_set3.py:/app/bot_set3.py:ro
      - ./config_set2.py:/app/config_set2.py:ro
      - ./recheck.py:/app/recheck.py:ro
      - ./export_log.py:/app/export_log.py:ro
      - ./clean_signal_errors.py:/app/clean_signal_errors.py:ro
    environment:
      - DATA_DIR=/app/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - BOT_SCRIPT=${BOT_SCRIPT:-/app/bot_set3.py}
    command: >
      sh -c "
        echo 'SHELL=/bin/sh' > /etc/cron.d/cryptobot &&
        echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /etc/cron.d/cryptobot &&
        echo \"ANTHROPIC_API_KEY=$$ANTHROPIC_API_KEY\" >> /etc/cron.d/cryptobot &&
        echo \"TELEGRAM_TOKEN=$$TELEGRAM_TOKEN\" >> /etc/cron.d/cryptobot &&
        echo \"TELEGRAM_CHAT_ID=$$TELEGRAM_CHAT_ID\" >> /etc/cron.d/cryptobot &&
        echo \"TG_BOT_TOKEN=$$TELEGRAM_TOKEN\" >> /etc/cron.d/cryptobot &&
        echo \"TG_CHAT_ID=$$TELEGRAM_CHAT_ID\" >> /etc/cron.d/cryptobot &&
        echo \"DATA_DIR=$$DATA_DIR\" >> /etc/cron.d/cryptobot &&
        echo '*/5 * * * * root python3 $${BOT_SCRIPT} >> /app/data/bot.log 2>&1' >> /etc/cron.d/cryptobot &&
        echo '0 17 * * * root python3 /app/recheck.py >> /app/data/recheck.log 2>&1' >> /etc/cron.d/cryptobot &&
        echo '' >> /etc/cron.d/cryptobot &&
        chmod 0644 /etc/cron.d/cryptobot &&
        cron -f
      "
    depends_on:
      crypto-api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: crypto-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./home:/usr/share/nginx/html:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - crypto-api

  certbot:
    image: certbot/certbot
    container_name: crypto-certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
